<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0091CE">
<meta property="og:title" content="Recess Land Giveaway">
<meta property="og:description" content="Play now — highest score wins 2 FREE tickets to Recessland! 23-24 May 2026, Dreamland Margate.">
<meta property="og:type" content="website">
<meta name="description" content="Play now — highest score wins 2 FREE tickets to Recessland! 23-24 May 2026, Dreamland Margate.">
<title>Recess Land Giveaway</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0091CE;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
    position: fixed;
    top: 0; left: 0;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function() {
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d');

  // Colors from Recessland
  const COL = {
    sky: '#0091CE',
    skyLight: '#00A3E8',
    cloud: '#E8F4FF',
    cloudShadow: '#8DD0F5',
    red: '#C0634A',
    redDark: '#9E4F3A',
    redLight: '#D4785E',
    cream: '#F0E6D6',
    white: '#FFFFFF',
    gold: '#FFD700',
    goldLight: '#FFEC80',
    orange: '#FF6D00',
    ground: '#4CB648',
    groundDark: '#3A9E38',
    groundLight: '#5EC85A',
    brown: '#8B6B4A',
  };

  // Game constants — scale with screen so difficulty feels equal on all devices
  // Base values tuned for 700px height (mobile portrait)
  const TARGET_FPS = 60;
  const BASE_H = 700;
  let hs = 1; // height scale factor, recalculated on resize
  let GRAVITY, FLAP_FORCE, PIPE_SPEED, PIPE_WIDTH, PIPE_GAP, PIPE_SPACING, BIRD_SIZE, GROUND_HEIGHT, MAX_PIPE_SHIFT;
  function recalcGameConstants() {
    hs = H / BASE_H;
    GRAVITY = 0.25 * hs;
    FLAP_FORCE = -4.6 * hs;
    PIPE_SPEED = 2.7 * hs;
    PIPE_WIDTH = Math.round(52 * hs);
    PIPE_GAP = Math.round(90 * hs);
    PIPE_SPACING = Math.round(260 * hs);
    BIRD_SIZE = Math.round(24 * hs);
    GROUND_HEIGHT = Math.round(100 * hs);
    MAX_PIPE_SHIFT = Math.round(280 * hs);
  }
  let lastTime = 0;
  let delta = 1;

  // State
  let W, H, dpr;
  let state = 'start'; // start, playing, gameover
  let bird, pipes, clouds, score, bestScore, frameCount;
  let ferrisAngle = 0;
  let gameoverTime = 0;
  let buntingOffset = 0;
  let crowd = [];
  let scorePop = 0; // animation timer for score pop effect
  let bgCanvas, bgCtx; // offscreen background cache
  let audioCtx = null;
  let musicPlaying = false;

  // Preload audio
  const ohSound = new Audio('./oh.mp3');
  ohSound.preload = 'auto';
  ohSound.volume = 0.25;
  const bgMusic = new Audio('./background.mp3');
  bgMusic.preload = 'auto';
  bgMusic.loop = true;
  bgMusic.volume = 0.4;

  // High score
  bestScore = parseInt(localStorage.getItem('recessland_best') || '0');

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    recalcGameConstants();
    if (crowd.length) renderBackground();
  }

  function initGame() {
    bird = { x: W * 0.25, y: H * 0.4, vy: 0, angle: 0, flapFrame: 0 };
    pipes = [];
    score = 0;
    frameCount = 0;
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W * 1.5,
        y: Math.random() * (H * 0.5),
        w: 60 + Math.random() * 80,
        speed: 0.3 + Math.random() * 0.4
      });
    }

    // Generate crowd — diverse festival crowd
    const skinTones = ['#8D5524', '#C68642', '#E0AC69', '#3B1E08', '#6B3A1F', '#4A2912', '#D4A373', '#2C1810'];
    const clothingColors = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6',
                            '#1ABC9C', '#E67E22', '#EC407A', '#FF6B35', '#FFEB3B',
                            '#00BCD4', '#FF4081', '#7C4DFF', '#C0634A'];
    const hatStyles = ['bucket', 'durag', 'headwrap', 'cap', 'none', 'none', 'none'];
    const hatColors = ['#C0634A', '#222', '#F0E6D6', '#9E4F3A', '#FFD700', '#E74C3C', '#FFF'];
    const hairColors = ['#1a1a1a', '#2C1810', '#333', '#4A2912'];
    crowd = [];
    const numPeople = W < 500 ? 15 + Math.floor(Math.random() * 8) : 30 + Math.floor(Math.random() * 15);
    for (let i = 0; i < numPeople; i++) {
      const dancing = Math.random() > 0.4; // 60% are dancing
      crowd.push({
        x: Math.random() * W,
        skin: skinTones[Math.floor(Math.random() * skinTones.length)],
        shirt: clothingColors[Math.floor(Math.random() * clothingColors.length)],
        pants: clothingColors[Math.floor(Math.random() * clothingColors.length)],
        hatStyle: hatStyles[Math.floor(Math.random() * hatStyles.length)],
        hatColor: hatColors[Math.floor(Math.random() * hatColors.length)],
        hairColor: hairColors[Math.floor(Math.random() * hairColors.length)],
        height: Math.round((16 + Math.floor(Math.random() * 10)) * hs),
        width: Math.round((6 + Math.floor(Math.random() * 4)) * hs),
        bobOffset: Math.random() * Math.PI * 2,
        dancing: dancing,
        danceSpeed: 0.04 + Math.random() * 0.04,
        armsUp: dancing && Math.random() > 0.5,
      });
    }

    initFireworks();
    renderBackground();
  }

  // --- Audio ---
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  function playTone(freq, duration, type, vol) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.08;
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playFlap() {
    if (!audioCtx) return;
    // Subtle wing flap — short noise burst with quick fade
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.06, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'bandpass';
    filt.frequency.value = 800;
    filt.Q.value = 0.8;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
    src.connect(filt);
    filt.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
  }
  function playScore() { playTone(880, 0.1, 'square', 0.07); setTimeout(() => playTone(1100, 0.12, 'square', 0.07), 80); }
  function playDeath() {
    // Clone the audio node each time to avoid playback state issues
    const sound = ohSound.cloneNode();
    sound.volume = ohSound.volume;
    sound.play().catch(() => {});
  }

  // Chiptune funfair melody loop
  const MELODY = [
    523, 587, 659, 698, 784, 698, 659, 587,
    523, 659, 784, 880, 784, 659, 523, 587,
    659, 784, 880, 988, 880, 784, 659, 523,
    587, 523, 494, 440, 494, 523, 587, 523
  ];
  let melodyIndex = 0;

  function startMusic() {
    if (musicPlaying) return;
    musicPlaying = true;
    bgMusic.currentTime = 0;
    bgMusic.volume = 0;
    bgMusic.play().catch(() => {});
    // Fade in over 2 seconds
    let fadeVol = 0;
    const fadeIn = setInterval(() => {
      fadeVol += 0.02;
      if (fadeVol >= 0.4) { bgMusic.volume = 0.4; clearInterval(fadeIn); }
      else { bgMusic.volume = fadeVol; }
    }, 50);
  }

  function stopMusic() {
    musicPlaying = false;
    bgMusic.pause();
  }

  // --- Drawing helpers ---
  function drawPixelRect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function drawPixelCloud(cx, cy, size) {
    const s = Math.round(size / 8);
    // Main body
    drawPixelRect(cx - s*3, cy, s*6, s*3, COL.cloud);
    drawPixelRect(cx - s*2, cy - s, s*4, s, COL.cloud);
    drawPixelRect(cx - s, cy - s*2, s*3, s, COL.cloud);
    // Shadow
    drawPixelRect(cx - s*3, cy + s*2, s*6, s, COL.cloudShadow);
    drawPixelRect(cx - s*2, cy + s*3, s*4, s, COL.cloudShadow);
  }

  function drawBird(x, y, angle, flapFrame) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const s = Math.round(4 * hs); // pixel size scaled with screen

    // Body — RECESS red bird
    drawPixelRect(-s*3, -s*2, s*6, s*5, COL.red);
    drawPixelRect(-s*2, -s*3, s*4, s, COL.red);
    drawPixelRect(-s*2, s*3, s*4, s, COL.redDark);

    // Belly
    drawPixelRect(-s*2, s, s*4, s*2, COL.redLight);

    // Eye (white with black pupil)
    drawPixelRect(s, -s*2, s*3, s*3, COL.white);
    drawPixelRect(s*2, -s*2, s*2, s*2, '#111');
    drawPixelRect(s*3, -s*2, s, s, COL.white); // shine

    // Beak (orange/gold)
    drawPixelRect(s*4, -s, s*2, s, COL.gold);
    drawPixelRect(s*4, 0, s*2, s, COL.orange);

    // Wing (flap animation)
    const wingUp = flapFrame % 10 < 5;
    if (wingUp) {
      drawPixelRect(-s*2, -s*4, s*3, s*2, COL.redDark);
    } else {
      drawPixelRect(-s*2, s*2, s*3, s*2, COL.redDark);
    }

    // Tail
    drawPixelRect(-s*4, -s, s*2, s, COL.redDark);
    drawPixelRect(-s*4, 0, s, s, COL.redDark);

    ctx.restore();
  }

  function drawPipe(x, topH, bottomY) {
    const pw = PIPE_WIDTH;
    const stripeH = Math.round(16 * hs);
    const capH = Math.round(20 * hs);
    const capW = pw + Math.round(16 * hs);
    const capOff = (capW - pw) / 2;
    const hlH = Math.round(4 * hs);

    // Top pipe - funfair tent pole style
    // Striped pattern
    for (let i = 0; i < topH; i += stripeH) {
      const col = (Math.floor(i / stripeH) % 2 === 0) ? COL.red : COL.cream;
      const h = Math.min(stripeH, topH - i);
      drawPixelRect(x, i, pw, h, col);
    }
    // Cap (top pipe bottom edge)
    drawPixelRect(x - capOff, topH - capH, capW, capH, COL.redDark);
    drawPixelRect(x - capOff, topH - capH, capW, hlH, COL.redLight);

    // Bottom pipe
    const bH = H - GROUND_HEIGHT - bottomY;
    for (let i = 0; i < bH; i += stripeH) {
      const col = (Math.floor(i / stripeH) % 2 === 0) ? COL.red : COL.cream;
      const h = Math.min(stripeH, bH - i);
      drawPixelRect(x, bottomY + i, pw, h, col);
    }
    // Cap (bottom pipe top edge)
    drawPixelRect(x - capOff, bottomY, capW, capH, COL.redDark);
    drawPixelRect(x - capOff, bottomY + capH - hlH, capW, hlH, COL.redLight);
  }

  function drawFerrisWheel(cx, cy, radius, angle) {
    const spokes = 8;
    ctx.strokeStyle = COL.cloudShadow;
    ctx.lineWidth = Math.max(2, Math.round(2 * hs));
    ctx.globalAlpha = 0.55;

    // Center
    ctx.beginPath();
    ctx.arc(cx, cy, Math.round(4 * hs), 0, Math.PI * 2);
    ctx.fillStyle = COL.cloudShadow;
    ctx.fill();

    // Outer rim
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Spokes and gondolas
    for (let i = 0; i < spokes; i++) {
      const a = angle + (Math.PI * 2 / spokes) * i;
      const sx = cx + Math.cos(a) * radius;
      const sy = cy + Math.sin(a) * radius;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(sx, sy);
      ctx.stroke();
      // Gondola
      const gw = Math.round(8 * hs), gh = Math.round(6 * hs);
      drawPixelRect(sx - gw / 2, sy, gw, gh, COL.cloudShadow);
      // Passengers
      const ps = Math.round(3 * hs);
      const rSkins = ['#8D5524', '#C68642', '#E0AC69', '#3B1E08', '#6B3A1F', '#4A2912', '#D4A373', '#2C1810'];
      drawPixelRect(sx - ps, sy - ps + 1, ps, ps, rSkins[i % rSkins.length]);
      drawPixelRect(sx + 1, sy - ps + 1, ps, ps, rSkins[(i + 3) % rSkins.length]);
    }

    // Stand
    ctx.beginPath();
    ctx.moveTo(cx - radius * 0.4, cy + radius + Math.round(10 * hs));
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx + radius * 0.4, cy + radius + Math.round(10 * hs));
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  function drawBunting(y, offset) {
    const spacing = Math.round(40 * hs);
    const bw = Math.round(8 * hs), bh = Math.round(14 * hs);
    ctx.globalAlpha = 0.25;
    for (let x = -spacing + (offset % spacing); x < W + spacing; x += spacing) {
      const colors = [COL.red, COL.cream, COL.redLight, COL.white];
      ctx.fillStyle = colors[Math.floor(x / spacing) % colors.length];
      ctx.beginPath();
      ctx.moveTo(x - bw, y);
      ctx.lineTo(x + bw, y);
      ctx.lineTo(x, y + bh);
      ctx.closePath();
      ctx.fill();
    }
    // String
    ctx.strokeStyle = COL.cloudShadow;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function drawTent(cx, groundY, w, h, color1, color2) {
    // Triangular tent top
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(cx - w/2, groundY);
    ctx.lineTo(cx, groundY - h);
    ctx.lineTo(cx + w/2, groundY);
    ctx.closePath();
    ctx.fillStyle = color1;
    ctx.fill();
    // Stripes
    const stripes = 4;
    for (let i = 0; i < stripes; i++) {
      if (i % 2 === 0) continue;
      const t1 = i / stripes;
      const t2 = (i + 1) / stripes;
      const x1l = cx - w/2 + (cx - (cx - w/2)) * t1;
      const x1r = cx + (cx + w/2 - cx) * t1;
      const x2l = cx - w/2 + (cx - (cx - w/2)) * t2;
      const x2r = cx + (cx + w/2 - cx) * t2;
      const y1 = groundY - h * (1 - t1);
      const y2 = groundY - h * (1 - t2);
      ctx.beginPath();
      ctx.moveTo(x1l, y1);
      ctx.lineTo(x2l, y2);
      ctx.lineTo(x2r, y2);
      ctx.lineTo(x1r, y1);
      ctx.closePath();
      ctx.fillStyle = color2;
      ctx.fill();
    }
    // Flag on top
    drawPixelRect(cx - 1, groundY - h - 8, 2, 10, color2);
    drawPixelRect(cx + 1, groundY - h - 8, 6, 4, color1);
    ctx.globalAlpha = 1;
  }

  function drawHelterSkelter(cx, groundY, radius, height) {
    ctx.globalAlpha = 0.65;
    // Tower
    const tw = radius * 2;
    for (let i = 0; i < height; i += 8) {
      const col = (Math.floor(i / 8) % 2 === 0) ? COL.red : COL.cream;
      // Taper slightly
      const taper = 1 - (i / height) * 0.3;
      const w = tw * taper;
      drawPixelRect(cx - w/2, groundY - i - 8, w, 8, col);
    }
    // Dome top
    drawPixelRect(cx - radius * 0.4, groundY - height - 8, radius * 0.8, 8, COL.redDark);
    drawPixelRect(cx - radius * 0.2, groundY - height - 14, radius * 0.4, 6, COL.red);
    // Flag
    drawPixelRect(cx - 1, groundY - height - 22, 2, 10, COL.cream);
    drawPixelRect(cx + 1, groundY - height - 22, 5, 4, COL.red);
    ctx.globalAlpha = 1;
  }

  function drawStage(cx, groundY, w, h) {
    ctx.globalAlpha = 0.6;
    // Stage platform
    drawPixelRect(cx - w/2, groundY - h * 0.3, w, h * 0.3, '#333');
    drawPixelRect(cx - w/2 + 4, groundY - h * 0.3, w - 8, 4, '#555');

    // Back wall
    drawPixelRect(cx - w/2 + 8, groundY - h, w - 16, h * 0.7, '#222');

    // Roof/truss
    drawPixelRect(cx - w/2 - 10, groundY - h - 8, w + 20, 10, '#444');
    drawPixelRect(cx - w/2 - 10, groundY - h - 10, w + 20, 4, '#555');

    // Speaker stacks on sides
    for (let s = 0; s < 3; s++) {
      const sy = groundY - h * 0.3 - s * 18 - 16;
      drawPixelRect(cx - w/2 - 8, sy, 16, 16, '#111');
      drawPixelRect(cx - w/2 - 6, sy + 3, 12, 10, '#333');
      drawPixelRect(cx + w/2 - 8, sy, 16, 16, '#111');
      drawPixelRect(cx + w/2 - 6, sy + 3, 12, 10, '#333');
    }

    // Stage lights (animated, colourful)
    const lightColors = [COL.red, COL.gold, '#00AAFF', COL.redLight, '#FF00FF', COL.white];
    const numLights = 6;
    for (let i = 0; i < numLights; i++) {
      const lx = cx - w/2 + 10 + (w - 20) * (i / (numLights - 1));
      const ly = groundY - h - 4;
      const flicker = Math.sin(frameCount * 0.1 + i * 1.7) > 0;
      if (flicker) {
        const col = lightColors[Math.floor(frameCount * 0.05 + i) % lightColors.length];
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(lx, ly, 4, 0, Math.PI * 2);
        ctx.fill();
        // Glow
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.arc(lx, ly, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.6;
      }
    }
    ctx.globalAlpha = 1;
  }

  // drawRollercoaster removed — now cached in renderBackground()

  // Fireworks state
  let fireworks = [];
  function initFireworks() {
    fireworks = [];
    const fwColors = [COL.red, COL.gold, COL.white, '#00AAFF', COL.redLight, '#FF66FF'];
    const fwCount = W < 500 ? 2 : 4;
    for (let i = 0; i < fwCount; i++) {
      fireworks.push({
        x: W * 0.15 + Math.random() * W * 0.7,
        y: 40 + Math.random() * (H * 0.25),
        phase: Math.random() * 100,
        color: fwColors[Math.floor(Math.random() * fwColors.length)],
        speed: 0.8 + Math.random() * 0.6,
        size: 20 + Math.random() * 30,
      });
    }
  }

  function drawFireworks() {
    fireworks.forEach(fw => {
      const t = ((frameCount * fw.speed + fw.phase) % 120) / 120; // 0-1 cycle
      if (t > 0.7) return; // dark phase between bursts

      const expand = t / 0.7; // 0-1 during burst
      const alpha = t < 0.35 ? 1 : 1 - (t - 0.35) / 0.35; // fade out
      const r = fw.size * expand;

      ctx.globalAlpha = alpha * 0.7;
      const sparks = W < 500 ? 8 : 12;
      for (let i = 0; i < sparks; i++) {
        const angle = (Math.PI * 2 / sparks) * i;
        const sx = fw.x + Math.cos(angle) * r;
        const sy = fw.y + Math.sin(angle) * r + expand * 8; // slight gravity
        const sparkSize = 2 + (1 - expand) * 2;
        ctx.fillStyle = fw.color;
        ctx.fillRect(Math.round(sx), Math.round(sy), sparkSize, sparkSize);
      }
      // Bright center at start
      if (t < 0.15) {
        ctx.fillStyle = COL.white;
        ctx.fillRect(Math.round(fw.x - 2), Math.round(fw.y - 2), 4, 4);
      }
    });
    ctx.globalAlpha = 1;
  }

  function drawPerson(p, groundY) {
    const x = p.x;
    const w = p.width;
    const h = p.height;
    const ps = hs; // pixel scale

    // Dancing bob
    const bobAmt = p.dancing ? Math.round(3 * ps) : Math.round(0.5 * ps);
    const bob = Math.sin(frameCount * (p.danceSpeed || 0.03) + p.bobOffset) * bobAmt;
    const footY = groundY + bob;

    // Legs/pants
    const legH = Math.floor(h * 0.35);
    const legSpread = p.dancing ? Math.sin(frameCount * p.danceSpeed + p.bobOffset) * Math.round(2 * ps) : 0;
    drawPixelRect(x - legSpread, footY - legH, Math.ceil(w / 2), legH, p.pants);
    drawPixelRect(x + Math.ceil(w / 2) + legSpread, footY - legH, Math.floor(w / 2), legH, p.pants);

    // Shirt/body
    const bodyH = Math.floor(h * 0.35);
    drawPixelRect(x, footY - legH - bodyH, w, bodyH, p.shirt);

    // Arms
    const headH = Math.floor(h * 0.3);
    const topOfBody = footY - legH - bodyH;
    const armW = Math.max(1, Math.round(2 * ps));

    if (p.armsUp) {
      const armWave = Math.sin(frameCount * p.danceSpeed * 1.5 + p.bobOffset) * Math.round(3 * ps);
      drawPixelRect(x - Math.round(3 * ps), topOfBody - headH + armWave, armW, headH, p.shirt);
      drawPixelRect(x + w + Math.round(1 * ps), topOfBody - headH - armWave, armW, headH, p.shirt);
    } else if (p.dancing) {
      const armSwing = Math.sin(frameCount * p.danceSpeed + p.bobOffset) * Math.round(2 * ps);
      drawPixelRect(x - Math.round(3 * ps), topOfBody + armSwing, armW, bodyH * 0.6, p.shirt);
      drawPixelRect(x + w + Math.round(1 * ps), topOfBody - armSwing, armW, bodyH * 0.6, p.shirt);
    }

    // Head
    const headTop = footY - legH - bodyH - headH;
    drawPixelRect(x, headTop, w, headH, p.skin);

    // Hair
    if (p.hatStyle === 'none') {
      drawPixelRect(x, headTop - Math.round(ps), w, Math.round(2 * ps), p.hairColor);
      if (Math.sin(p.bobOffset * 100) > 0.3) {
        drawPixelRect(x - Math.round(ps), headTop - Math.round(2 * ps), w + Math.round(2 * ps), Math.round(3 * ps), p.hairColor);
      }
    }

    // Hat styles
    const ho = Math.round(ps);
    if (p.hatStyle === 'bucket') {
      drawPixelRect(x - 2 * ho, headTop - 2 * ho, w + 4 * ho, 3 * ho, p.hatColor);
      drawPixelRect(x - ho, headTop - 5 * ho, w + 2 * ho, 3 * ho, p.hatColor);
    } else if (p.hatStyle === 'durag') {
      drawPixelRect(x, headTop - ho, w, 2 * ho, p.hatColor);
      drawPixelRect(x + w, headTop, 3 * ho, 2 * ho, p.hatColor);
    } else if (p.hatStyle === 'headwrap') {
      drawPixelRect(x - ho, headTop - 3 * ho, w + 2 * ho, 4 * ho, p.hatColor);
      drawPixelRect(x, headTop - 5 * ho, w, 2 * ho, p.hatColor);
    } else if (p.hatStyle === 'cap') {
      drawPixelRect(x - ho, headTop - 2 * ho, w + 3 * ho, 3 * ho, p.hatColor);
      drawPixelRect(x + w, headTop - 2 * ho, 3 * ho, 2 * ho, p.hatColor);
    }
  }

  function drawCrowd(groundY) {
    crowd.forEach(p => drawPerson(p, groundY));
  }

  function renderBackground() {
    // Render static ground, funfair, and crowd to offscreen canvas
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W * dpr;
    bgCanvas.height = H * dpr;
    bgCtx = bgCanvas.getContext('2d');
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Swap ctx temporarily
    const mainCtx = ctx;
    ctx = bgCtx;

    const gy = H - GROUND_HEIGHT;

    // Static funfair elements — scale with height for consistency
    const s = hs;

    // Rollercoaster track (static part only)
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#666';
    ctx.lineWidth = Math.max(2, 3 * s);
    ctx.beginPath();
    const trackY = gy - 160 * s;
    const amp1 = 80 * s, amp2 = 40 * s;
    for (let x = 0; x <= W; x += 4) {
      const y = trackY + Math.sin(x * 0.012) * amp1 - Math.cos(x * 0.008) * amp2;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    for (let x = 30; x < W; x += Math.max(30, 60 * s)) {
      const y = trackY + Math.sin(x * 0.012) * amp1 - Math.cos(x * 0.008) * amp2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, gy);
      ctx.strokeStyle = '#555'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Stage
    drawStage(W * 0.35, gy, 160 * s, 120 * s);

    // Tents
    drawTent(W * 0.45, gy, 300 * s, 200 * s, COL.red, COL.cream);
    drawTent(W * 0.05, gy, 220 * s, 140 * s, COL.redLight, COL.white);
    drawTent(W * 0.65, gy, 180 * s, 120 * s, COL.redDark, COL.cream);

    // Helter skelter
    drawHelterSkelter(W * 0.92, gy, 40 * s, 220 * s);

    // Stall canopies
    ctx.globalAlpha = 0.6;
    [W * 0.3, W * 0.55, W * 0.85].forEach(sx => {
      const sw = 140 * s, sh = 60 * s;
      drawPixelRect(sx - sw/2, gy - sh, sw, sh, COL.redDark);
      drawPixelRect(sx - sw/2, gy - sh, sw, Math.max(4, 6 * s), COL.redLight);
      for (let i = 0; i < sw; i += Math.max(8, 14 * s)) {
        drawPixelRect(sx - sw/2 + i, gy - Math.max(4, 6 * s), Math.max(6, 10 * s), Math.max(4, 6 * s), COL.cream);
      }
    });
    ctx.globalAlpha = 1;

    // Grass top
    const gd = Math.round(8 * hs);
    drawPixelRect(0, gy, W, gd, COL.groundLight);
    drawPixelRect(0, gy + gd, W, GROUND_HEIGHT - gd, COL.ground);
    for (let x = 0; x < W; x += gd * 2) {
      if (Math.sin(x * 0.3) > 0.3) drawPixelRect(x, gy + gd, gd, gd, COL.groundDark);
    }
    drawPixelRect(0, H - gd * 2, W, gd * 2, COL.brown);

    // Restore main context
    ctx = mainCtx;
  }

  function drawGround() {
    // Blit cached background
    if (bgCanvas) {
      ctx.drawImage(bgCanvas, 0, 0, W * dpr, H * dpr, 0, 0, W, H);
    }

    // Only animated elements drawn live each frame
    const gy = H - GROUND_HEIGHT;
    const s = hs;

    // Rollercoaster carts with riders (animated)
    const trackY = gy - 160 * s;
    const amp1 = 80 * s, amp2 = 40 * s;
    const cartW = Math.round(14 * s), cartH = Math.round(8 * s);
    const headS = Math.round(4 * s);
    const riderSkins = ['#8D5524', '#C68642', '#E0AC69', '#3B1E08', '#6B3A1F', '#4A2912'];
    const cartColors = [COL.red, '#00AAFF', COL.gold];
    ctx.globalAlpha = 0.6;
    for (let c = 0; c < 3; c++) {
      const cx = ((frameCount * 1.2 + c * W / 3) % (W + 40)) - 20;
      const cy = trackY + Math.sin(cx * 0.012) * amp1 - Math.cos(cx * 0.008) * amp2;
      drawPixelRect(cx - cartW / 2, cy - cartH, cartW, cartH, cartColors[c]);
      // Riders
      drawPixelRect(cx - headS, cy - cartH - headS, headS, headS, riderSkins[c]);
      drawPixelRect(cx + 1, cy - cartH - headS, headS, headS, riderSkins[c + 3]);
    }
    ctx.globalAlpha = 1;

    // Ferris wheels (animated rotation)
    const fwRadius = Math.min(220 * s, W * 0.35);
    drawFerrisWheel(W * 0.75, gy - fwRadius - 5, fwRadius, ferrisAngle);
    if (W > 300) {
      const fwRadius2 = Math.min(150 * s, W * 0.25);
      drawFerrisWheel(W * 0.2, gy - fwRadius2 - 5, fwRadius2, -ferrisAngle * 0.7);
    }

    // Bunting (animated sway)
    drawBunting(gy - Math.min(180 * s, fwRadius + 25), buntingOffset);

    // Animated crowd
    drawCrowd(gy);
  }

  function drawScore() {
    // Score pop animation
    const popScale = scorePop > 0 ? 1 + Math.sin(scorePop * 0.3) * 0.4 : 1;
    if (scorePop > 0) scorePop--;

    const scoreStr = score.toString();
    ctx.font = '48px "Press Start 2P", monospace';
    ctx.textAlign = 'left';

    // Dark pill background
    const metrics = ctx.measureText(scoreStr);
    const padX = 20, padY = 14;
    const boxW = metrics.width + padX * 2;
    const boxH = 48 + padY * 2;
    const bx = 16, by = 16;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(bx, by, boxW, boxH);

    // Centre text in box
    const cx = bx + boxW / 2;
    const cy = by + boxH / 2;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(popScale, popScale);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillText(scoreStr, 3, 3);
    ctx.fillStyle = COL.white;
    ctx.fillText(scoreStr, 0, 0);

    ctx.restore();
    ctx.textBaseline = 'alphabetic';
  }

  function drawStartScreen() {
    // Dim background for legibility
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';

    // RECESSLAND title — BIG, responsive to screen width
    const title = 'RECESSLAND';
    const titleY = H * 0.18;
    const maxCharW = Math.floor((W - 20) / title.length);
    const charW = Math.min(38, maxCharW);
    const fontSize = Math.min(24, charW - 8);
    const blockH = Math.min(44, charW + 6);
    const totalW = title.length * charW;
    const startX = W/2 - totalW/2;

    for (let i = 0; i < title.length; i++) {
      drawPixelRect(startX + i * charW, titleY - blockH/2, charW - 3, blockH, COL.red);
      ctx.fillStyle = COL.white;
      ctx.font = fontSize + 'px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(title[i], startX + i * charW + (charW - 3)/2, titleY + fontSize/3);
    }

    // Subtitle
    ctx.textAlign = 'center';
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillStyle = COL.cream;
    ctx.fillText('SUMMER STARTS HERE', W/2, titleY + blockH/2 + 25);
    ctx.font = '8px "Press Start 2P", monospace';
    ctx.fillStyle = COL.cloudShadow;
    ctx.fillText('23-24 MAY 2026 \u2022 DREAMLAND MARGATE', W/2, titleY + blockH/2 + 42);

    // Prize banner — prominent
    const bannerY = H * 0.56;
    const bannerH = 70;
    const bannerW = Math.min(W - 30, 340);
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(W/2 - bannerW/2, bannerY, bannerW, bannerH);
    ctx.fillStyle = COL.gold;
    ctx.fillRect(W/2 - bannerW/2, bannerY, bannerW, 3);
    ctx.fillRect(W/2 - bannerW/2, bannerY + bannerH - 3, bannerW, 3);
    ctx.fillRect(W/2 - bannerW/2, bannerY, 3, bannerH);
    ctx.fillRect(W/2 + bannerW/2 - 3, bannerY, 3, bannerH);

    ctx.font = '11px "Press Start 2P", monospace';
    ctx.fillStyle = COL.gold;
    ctx.fillText('HIGHEST SCORE WINS', W/2, bannerY + 26);
    ctx.font = '16px "Press Start 2P", monospace';
    ctx.fillStyle = COL.white;
    ctx.fillText('2 FREE TICKETS!', W/2, bannerY + 52);

    // TAP TO VIBE — big blinking
    const blink = Math.sin(frameCount * 0.08) > 0;
    if (blink) {
      ctx.font = '16px "Press Start 2P", monospace';
      ctx.fillStyle = COL.white;
      ctx.fillText('TAP TO VIBE', W/2, H * 0.76);
    }

    // Best score
    if (bestScore > 0) {
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillStyle = COL.cloudShadow;
      ctx.fillText('BEST: ' + bestScore, W/2, H * 0.83);
    }
  }

  // Button positions for game over (stored for hit detection)
  let retryBtn = { x: 0, y: 0, w: 0, h: 0 };
  let shareBtn = { x: 0, y: 0, w: 0, h: 0 };

  function drawGameOver() {
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';

    // GAME OVER — big
    ctx.font = '20px "Press Start 2P", monospace';
    ctx.fillStyle = COL.white;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText('GAME OVER', W/2 + 2, H * 0.18 + 2);
    ctx.fillStyle = COL.white;
    ctx.fillText('GAME OVER', W/2, H * 0.18);

    // Score — massive
    ctx.font = '12px "Press Start 2P", monospace';
    ctx.fillStyle = COL.cloudShadow;
    ctx.fillText('SCORE', W/2, H * 0.27);

    ctx.font = '48px "Press Start 2P", monospace';
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillText(score, W/2 + 3, H * 0.35 + 3);
    ctx.fillStyle = COL.white;
    ctx.fillText(score, W/2, H * 0.35);

    // Best score
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillStyle = COL.cloudShadow;
    ctx.fillText('BEST: ' + bestScore, W/2, H * 0.41);

    // New best indicator
    if (score >= bestScore && score > 0) {
      ctx.font = '12px "Press Start 2P", monospace';
      ctx.fillStyle = COL.gold;
      ctx.fillText('NEW BEST!', W/2, H * 0.46);
    }

    // Big buttons
    const btnW = Math.min(W * 0.8, 300);
    const btnH = 58;
    const btnGap = 24;
    const btnX = W/2 - btnW/2;

    // RUN IT BACK button
    const retryY = H * 0.50;
    drawPixelRect(btnX, retryY, btnW, btnH, COL.red);
    drawPixelRect(btnX + 3, retryY + 3, btnW - 6, btnH - 6, COL.redDark);
    drawPixelRect(btnX + 6, retryY + 6, btnW - 12, btnH - 12, COL.red);
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillStyle = COL.white;
    ctx.textBaseline = 'middle';
    ctx.fillText('RUN IT BACK', W/2, retryY + btnH/2);
    retryBtn = { x: btnX, y: retryY, w: btnW, h: btnH };

    // SHARE WITH A FRIEND button
    const shareY = retryY + btnH + btnGap;
    drawPixelRect(btnX, shareY, btnW, btnH, COL.cloudShadow);
    drawPixelRect(btnX + 3, shareY + 3, btnW - 6, btnH - 6, '#0077B6');
    drawPixelRect(btnX + 6, shareY + 6, btnW - 12, btnH - 12, COL.cloudShadow);
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillStyle = COL.white;
    ctx.fillText('SHARE WITH A FRIEND', W/2, shareY + btnH/2);
    ctx.textBaseline = 'alphabetic';
    shareBtn = { x: btnX, y: shareY, w: btnW, h: btnH };

    // Prize text — clear
    ctx.font = '9px "Press Start 2P", monospace';
    ctx.fillStyle = COL.redLight;
    ctx.fillText('HIGHEST SCORE WINS', W/2, H * 0.76);
    ctx.font = '12px "Press Start 2P", monospace';
    ctx.fillStyle = COL.white;
    ctx.fillText('2 FREE TICKETS!', W/2, H * 0.81);

    // Link
    ctx.font = '10px "Press Start 2P", monospace';
    ctx.fillStyle = COL.cloudShadow;
    ctx.fillText('RECESS.LAND', W/2, H * 0.88);
  }

  function shareScore() {
    const text = 'I scored ' + score + ' on Recess Land Giveaway! Can you beat me? \uD83C\uDFA1 Play now and win 2 FREE tickets to Recessland!';
    const url = 'https://www.recess.land';
    if (navigator.share) {
      navigator.share({ title: 'Recess Land Giveaway', text: text, url: url }).catch(() => {});
    } else {
      // Fallback: copy to clipboard
      navigator.clipboard.writeText(text + ' ' + url).then(() => {
        // Brief visual feedback handled by state
      }).catch(() => {});
    }
  }

  // --- Game logic ---
  function flap() {
    if (state === 'start') {
      initAudio();
      state = 'playing';
      initGame();
      startMusic();
      bird.vy = FLAP_FORCE;
      playFlap();
      return;
    }
    if (state === 'playing') {
      bird.vy = FLAP_FORCE;
      bird.flapFrame = 0;
      playFlap();
      return;
    }
    if (state === 'gameover') {
      if (Date.now() - gameoverTime < 750) return;
      state = 'start';
      initGame();
      return;
    }
  }

  function update() {
    frameCount++;

    if (state === 'start') {
      // Bob the preview bird
      bird.y = H * 0.55 + Math.sin(frameCount * 0.05) * 8;
      // Animate clouds
      clouds.forEach(c => {
        c.x -= c.speed * delta;
        if (c.x + c.w < -20) { c.x = W + 20; c.y = Math.random() * (H * 0.5); }
      });
      ferrisAngle += 0.005 * delta;
      buntingOffset += 0.3 * delta;
      return;
    }

    if (state !== 'playing') return;

    // Bird physics
    bird.vy += GRAVITY * delta;
    bird.y += bird.vy * delta;
    bird.angle = Math.min(Math.max(bird.vy * 0.06, -0.5), 1.2);
    bird.flapFrame++;

    // Spawn pipes
    const lastPipe = pipes[pipes.length - 1];
    if (!lastPipe || lastPipe.x < W - PIPE_SPACING) {
      const minTop = 80;
      const maxTop = H - GROUND_HEIGHT - PIPE_GAP - 80;
      let topH;
      if (lastPipe) {
        // Constrain vertical shift — max 120px change from previous pipe
        const maxShift = MAX_PIPE_SHIFT;
        const low = Math.max(minTop, lastPipe.topH - maxShift);
        const high = Math.min(maxTop, lastPipe.topH + maxShift);
        topH = low + Math.random() * (high - low);
      } else {
        // First pipe — start near middle
        const mid = (minTop + maxTop) / 2;
        topH = mid + (Math.random() - 0.5) * 100;
      }
      topH = Math.max(minTop, Math.min(maxTop, topH));
      const spawnX = !lastPipe ? W + PIPE_WIDTH : W + PIPE_WIDTH + 20;
      pipes.push({ x: spawnX, topH: topH, bottomY: topH + PIPE_GAP, scored: false });
    }

    // Move pipes
    pipes.forEach(p => {
      p.x -= PIPE_SPEED * delta;
      // Score
      if (!p.scored && p.x + PIPE_WIDTH < bird.x) {
        p.scored = true;
        score++;
        scorePop = 10;
        playScore();
      }
    });

    // Remove off-screen pipes
    pipes = pipes.filter(p => p.x + PIPE_WIDTH > -20);

    // Clouds
    clouds.forEach(c => {
      c.x -= c.speed * delta;
      if (c.x + c.w < -20) { c.x = W + 20; c.y = Math.random() * (H * 0.5); }
    });

    ferrisAngle += 0.008 * delta;
    buntingOffset += 0.5 * delta;

    // Collision detection
    const bx = bird.x - BIRD_SIZE/2;
    const by = bird.y - BIRD_SIZE/2;
    const bw = BIRD_SIZE;
    const bh = BIRD_SIZE;

    // Ground/ceiling
    if (bird.y + BIRD_SIZE/2 > H - GROUND_HEIGHT || bird.y - BIRD_SIZE/2 < 0) {
      die();
      return;
    }

    // Pipes
    for (const p of pipes) {
      // Top pipe
      if (bx + bw > p.x && bx < p.x + PIPE_WIDTH) {
        if (by < p.topH || by + bh > p.bottomY) {
          die();
          return;
        }
      }
    }
  }

  function die() {
    state = 'gameover';
    gameoverTime = Date.now();
    stopMusic();
    playDeath();
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('recessland_best', bestScore.toString());
    }
  }

  function draw() {
    // Sky gradient (simple two-tone)
    drawPixelRect(0, 0, W, H * 0.5, COL.sky);
    drawPixelRect(0, H * 0.5, W, H * 0.5, COL.skyLight);

    // Clouds
    clouds.forEach(c => drawPixelCloud(c.x, c.y, c.w));

    // Golden sparkle crosses (like the promo flyers)
    for (let i = 0; i < 8; i++) {
      const sx = (i * 137 + frameCount * 0.15) % (W + 60) - 30;
      const sy = (i * 97 + 50) % (H * 0.7);
      const pulse = 0.5 + Math.sin(frameCount * 0.06 + i * 1.3) * 0.5;
      const size = 3 + pulse * 5;
      ctx.globalAlpha = 0.3 + pulse * 0.5;
      ctx.fillStyle = COL.gold;
      // Vertical bar of cross
      drawPixelRect(sx - 1, sy - size, 3, size * 2, COL.gold);
      // Horizontal bar of cross
      drawPixelRect(sx - size, sy - 1, size * 2, 3, COL.gold);
      // Bright center
      ctx.fillStyle = COL.goldLight;
      drawPixelRect(sx - 1, sy - 1, 3, 3, COL.goldLight);
    }
    ctx.globalAlpha = 1;

    // Ground
    drawGround();

    // Fireworks
    drawFireworks();

    // Pipes
    if (state === 'playing' || state === 'gameover') {
      pipes.forEach(p => drawPipe(p.x, p.topH, p.bottomY));
    }

    // Bird
    drawBird(bird.x, bird.y, bird.angle || 0, bird.flapFrame || frameCount);

    // UI
    if (state === 'playing') drawScore();
    if (state === 'start') drawStartScreen();
    if (state === 'gameover') drawGameOver();
  }

  function loop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const elapsed = timestamp - lastTime;
    lastTime = timestamp;
    // delta = how many 60fps frames worth of time passed (1.0 at 60fps, 2.0 at 30fps)
    delta = Math.min(elapsed / (1000 / TARGET_FPS), 3);
    if (delta <= 0) delta = 1;
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // --- Input ---
  function getEventPos(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function hitTest(pos, btn) {
    return pos.x >= btn.x && pos.x <= btn.x + btn.w && pos.y >= btn.y && pos.y <= btn.y + btn.h;
  }

  function handleInput(e) {
    e.preventDefault();
    if (state === 'gameover') {
      if (Date.now() - gameoverTime < 750) return;
      const pos = getEventPos(e);
      if (hitTest(pos, retryBtn)) {
        state = 'start';
        initGame();
        return;
      }
      if (hitTest(pos, shareBtn)) {
        shareScore();
        return;
      }
      // Tap anywhere else also retries
      state = 'start';
      initGame();
      return;
    }
    flap();
  }

  canvas.addEventListener('touchstart', handleInput, { passive: false });
  canvas.addEventListener('mousedown', handleInput);
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); flap(); } });

  // --- Init ---
  resize();
  initGame();
  window.addEventListener('resize', resize);
  requestAnimationFrame(loop);
})();
</script>
